# Builds herdr-context for every platform Herdr's install can run on and
# attaches the binaries, with checksums.txt, to the version's GitHub release.
# scripts/fetch.sh — the plugin's build step — downloads from there, so users
# need no Go toolchain.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build binaries for, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} \
              go build -trimpath -ldflags "-s -w" -o "dist/herdr-context-${t%/*}-${t#*/}" ./cmd/herdr-context
          done
          (cd dist && sha256sum herdr-context-* > checksums.txt)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "herdr-context ${TAG#v}" --notes "Prebuilt binaries for Linux and macOS."
          gh release upload "$TAG" dist/* --clobber
